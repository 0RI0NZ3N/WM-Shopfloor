<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2327">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MEII Shop Floor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand" data-act="goDash"><img src="icons/logo-light.png" alt="Modern Elevator"><span class="app">Shop Floor</span><span class="ver" id="appVersion" title="Build version — confirms this tablet has the latest push"></span></div>
  <nav class="tabs" id="tabs"></nav>
  <button class="btn primary" data-act="importList">+ Import product list</button>
</header>
<main id="main"></main>

<div id="drawer" class="drawer" hidden></div>
<div id="sheetWrap" class="sheetwrap" hidden><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast" hidden></div>
<div id="print"></div>

<input type="file" id="fileList" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="fileMove" accept=".json,.csv,.pdf,application/json,text/csv,application/pdf" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>
<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fileBol" accept="application/pdf,image/*" hidden>
<input type="file" id="fileLaser" accept="application/pdf,.pdf" hidden>

<script src="vendor/qrcode.js"></script>
<script src="vendor/jsqr.js"></script>
<script src="db.js"></script>
<script src="ocr.js"></script>
<script src="parse.js"></script>
<script src="moveparse.js"></script>
<script src="pdfexport.js"></script>
<script src="zebra.js"></script>
<script src="app.js"></script>
<script>
  // sw.js calls skipWaiting() + clients.claim() on every deploy, so a newer
  // service worker takes over as soon as it's installed — this makes sure
  // the open page actually reloads onto it instead of carrying on with the
  // old cached app.js in memory. Combined with the version number in the
  // header, reopening the app after a push always lands on the new build.
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    // Only reload on a LATER controllerchange, not the very first one — a
    // page's first-ever visit also fires this event once the fresh service
    // worker claims it, which isn't an update and would otherwise cause an
    // unwanted extra reload on first install. navigator.serviceWorker.controller
    // being already set here means this page was already under an older
    // worker's control, so a controllerchange from here on really is a
    // newer version taking over.
    let armed = !!navigator.serviceWorker.controller;
    let reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(!armed){ armed = true; return; }
      if(reloadedForUpdate) return;
      reloadedForUpdate = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
